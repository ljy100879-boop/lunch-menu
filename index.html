<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>점심 뭐 먹지</title>
  <script>try { const t = JSON.parse(localStorage.getItem('theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="locbar">
      <div class="loc-row">
        <div class="loc-text">
          <div class="loc-label">기준 위치 · 반경 <span id="radius-select" class="radius-select" role="group" aria-label="검색 반경"></span></div>
          <strong id="loc-address" class="loc-address">불러오는 중…</strong>
        </div>
        <div class="loc-actions">
          <button type="button" id="btn-mylocation" class="btn-ghost">내 위치</button>
          <button type="button" id="btn-search-toggle" class="btn-ghost" aria-expanded="false" aria-controls="search-form">주소 검색</button>
          <button type="button" id="btn-pick" class="btn-ghost" aria-pressed="false">지도에서 찍기</button>
          <button type="button" id="btn-theme" class="btn-ghost btn-icon" aria-label="다크 모드로 바꾸기">☾</button>
        </div>
      </div>
      <form id="search-form" class="search-form" hidden>
        <input id="search-input" type="search" placeholder="주소나 장소 이름 (예: 강남역)" autocomplete="off" aria-label="주소나 장소 이름">
        <button type="submit" class="btn-primary">찾기</button>
      </form>
      <div id="notice" class="notice" role="status" hidden></div>
    </header>

    <nav id="tabs" class="tabs" role="tablist" aria-label="메뉴 종류"></nav>

    <section class="map-wrap" aria-label="지도">
      <div id="map"></div>
      <button type="button" id="btn-research" class="btn-research" hidden>이 위치에서 다시 찾기</button>
      <div id="pick-hint" class="pick-hint" hidden>지도를 눌러 위치를 정하세요</div>
    </section>

    <section id="list-wrap" class="list-wrap" aria-label="식당 목록">
      <div id="list-status" class="list-status"></div>
      <ul id="list" class="list"></ul>
      <p class="footnote">도보 시간은 직선거리(분당 67m) 기준이라 실제 경로와 다를 수 있어요. 지도·장소 데이터 © Kakao</p>
    </section>

    <button type="button" id="btn-random" class="fab" hidden>오늘 뭐 먹지?</button>
    <div id="sheet" class="sheet" role="dialog" aria-labelledby="sheet-title" hidden></div>

    <dialog id="exclude-dialog" class="dialog" aria-labelledby="exclude-title">
      <form method="dialog">
        <h2 id="exclude-title" class="dialog-title">제외 설정</h2>
        <p class="dialog-desc">빼 둔 카테고리와 숨긴 식당은 탭·목록·지도·랜덤 추천에 나오지 않아요. 이 브라우저에 저장돼요.</p>
        <div class="dialog-section-head">
          <h3 class="dialog-section">카테고리</h3>
          <button type="button" id="btn-include-all" class="btn-link">모두 포함</button>
        </div>
        <div id="exclude-options" class="exclude-options"></div>
        <h3 class="dialog-section">숨긴 식당</h3>
        <ul id="hidden-list" class="hidden-list"></ul>
        <div class="dialog-actions">
          <button type="submit" class="btn-primary">완료</button>
        </div>
      </form>
    </dialog>
  </div>
</body>
</html>
